[project]
name = "identity-service"
version = "0.1.0"
description = "Creator OS — Identity Service (Sprint F1) : Auth, IAM, RBAC, tenants, sessions, audit"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.7",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends(...) en valeur par défaut est le pattern documenté de FastAPI, pas une erreur.
extend-immutable-calls = ["fastapi.Depends", "app.rbac.require_permission"]
