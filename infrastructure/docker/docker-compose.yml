# Environnement d'infrastructure de base — Sprint F0.
# Ne contient volontairement aucun service applicatif : aucun n'est
# encore implémenté (voir services/*/README.md). Ce fichier grossira
# service par service à mesure qu'ils seront codés (Sprint F1+).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creator_os
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: creator_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: creator_os
      MINIO_ROOT_PASSWORD: local_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
