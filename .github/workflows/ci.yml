name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure-and-config-check:
    name: Structure & config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python3 scripts/check_structure.py

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    continue-on-error: true # Sprint F0 : ne bloque pas tant que les règles ne sont pas ajustées à l'équipe
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  identity-service:
    name: identity service — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app/ tests/ alembic/
      - run: pytest -q
        env:
          # Tests tournent sur SQLite en mémoire (voir tests/conftest.py) — pas besoin
          # de Postgres réel en CI pour ce sprint. JWT_SECRET requis même en test.
          jwt_secret: ci-test-secret-not-for-production

  packages-security:
    name: packages/security — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check creator_os_security/ tests/
      - run: pytest -q

  creator-service:
    name: creator service — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/creator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ordre requis : creator dépend de packages/security en local (pas publié).
      - run: pip install -e ../../packages/security
      - run: pip install -e ".[dev]"
      - run: ruff check app/ tests/
      - run: pytest -q

  # TODO : ajouter un job par service au fur et à mesure de leur implémentation
  # (même structure que identity-service ci-dessus).

  frontend:
    name: Frontend lint & test
    runs-on: ubuntu-latest
    if: false # TODO : activer une fois apps/web et packages/* contiennent du code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint test
